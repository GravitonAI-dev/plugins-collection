name: control-calidad

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  control-calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Control de calidad
        env:
          # En un PR se compara con la rama destino. En un push a develop o main la base es la propia
          # rama, asi que solo corre el validador: las versiones ya se exigieron en el PR.
          BASE_REF: origin/${{ github.base_ref || github.ref_name }}
        run: bash scripts/control_calidad.sh
